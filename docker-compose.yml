---
services:
  web:
    restart: unless-stopped
    image: dalibo/explain.dalibo.com:latest
    ports:
      - "5000:5000"
    links:
      - postgres:postgres
    environment:
      DEBUG_TB_PROFILER_ENABLED: true
      DB_SERVICE: postgres

  postgres:
    restart: unless-stopped
    image: postgres:latest
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres

volumes:
  db-data:
